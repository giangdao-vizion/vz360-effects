<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js — 100 Blooming Firefly fireflies (v0.181.2)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const loader = new THREE.TextureLoader().setPath('images/');

// Skybox
const materials = [
  new THREE.MeshBasicMaterial({ map: loader.load('2048-px.jpeg'), side: THREE.BackSide }),
  new THREE.MeshBasicMaterial({ map: loader.load('2048-nx.jpeg'), side: THREE.BackSide }),
  new THREE.MeshBasicMaterial({ map: loader.load('2048-py.jpeg'), side: THREE.BackSide }),
  new THREE.MeshBasicMaterial({ map: loader.load('2048-ny.jpeg'), side: THREE.BackSide }),
  new THREE.MeshBasicMaterial({ map: loader.load('2048-pz.jpeg'), side: THREE.BackSide }),
  new THREE.MeshBasicMaterial({ map: loader.load('2048-nz.jpeg'), side: THREE.BackSide })
];

const skyboxGeometry = new THREE.BoxGeometry(1000, 1000, 1000);
const skybox = new THREE.Mesh(skyboxGeometry, materials);
scene.add(skybox);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 50, 140);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.3));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;

// Ambient light
const ambient = new THREE.AmbientLight(0xffffff, 0.05);
scene.add(ambient);

// Fireflies
const COUNT = 100;
const CUBE_SIZE = 1;
const AREA = 500;
const geometry = new THREE.SphereGeometry(CUBE_SIZE, 8, 8);
const fireflies = [];
const BLOOM_LAYER = 1;

for (let i = 0; i < COUNT; i++) {
  const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
  const material = new THREE.MeshBasicMaterial({ color: color, toneMapped: false });
  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(
    (Math.random() - 0.5) * AREA,
    (Math.random() - 0.5) * AREA * 0.6,
    (Math.random() - 0.5) * AREA
  );

  const s = 0.6 + Math.random() * 1.2;
  mesh.scale.set(s, s, s);

  mesh.userData.velocity = new THREE.Vector3(
    (Math.random() - 0.5) * 0.9,
    (Math.random() - 0.5) * 0.9,
    (Math.random() - 0.5) * 0.9
  );
  mesh.userData.rotSpeed = new THREE.Vector3(
    (Math.random() - 0.5) * 0.02,
    (Math.random() - 0.5) * 0.02,
    (Math.random() - 0.5) * 0.02
  );

  mesh.layers.enable(BLOOM_LAYER); // Enable bloom layer only for spheres

  scene.add(mesh);
  fireflies.push(mesh);
}

// Post-processing for bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  3.0, 0.0, 0.0
);
composer.addPass(bloomPass);

// Material swap for selective bloom
const darkMaterial = new THREE.MeshBasicMaterial({ color: "black" });
const backupMaterials = {};

function darkenNonBloom(obj) {
  if (obj.isMesh && !obj.layers.test(BLOOM_LAYER)) {
    backupMaterials[obj.uuid] = obj.material;
    obj.material = darkMaterial;
  }
}

function restoreMaterial(obj) {
  if (backupMaterials[obj.uuid]) {
    obj.material = backupMaterials[obj.uuid];
    delete backupMaterials[obj.uuid];
  }
}

// Animation
function animate() {
  requestAnimationFrame(animate);

  for (const m of fireflies) {
    m.position.addScaledVector(m.userData.velocity, 0.8);
    m.rotation.x += m.userData.rotSpeed.x;
    m.rotation.y += m.userData.rotSpeed.y;
    m.rotation.z += m.userData.rotSpeed.z;

    const limit = AREA / 2;
    if (m.position.x > limit) m.position.x = -limit;
    if (m.position.x < -limit) m.position.x = limit;
    if (m.position.y > limit * 0.6) m.position.y = -limit * 0.6;
    if (m.position.y < -limit * 0.6) m.position.y = limit * 0.6;
    if (m.position.z > limit) m.position.z = -limit;
    if (m.position.z < -limit) m.position.z = limit;
  }

  controls.update();

  // --- Render bloom ---
  scene.traverse(darkenNonBloom);
  composer.render();
  scene.traverse(restoreMaterial);

  // --- Render normal scene ---
  renderer.render(scene, camera);
}

animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Fireflies click randomize velocity
window.addEventListener('click', () => {
  for (const m of fireflies) {
    m.userData.velocity.set(
      (Math.random() - 0.5) * 1.5,
      (Math.random() - 0.5) * 1.5,
      (Math.random() - 0.5) * 1.5
    );
  }
});
</script>
</body>
</html>
