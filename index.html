<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vizion demo - Blooming Firefly Cubes (v0.181.2)</title>
  <style>
    html, body { height: 100%; margin: 0; background-color: black; }
    canvas { display: block; }
  </style>

  <!-- Import map for Three.js v0.181.2 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="x-shader/x-vertex" id="vertexshader">

			varying vec2 vUv;

			void main() {

				vUv = uv;

				gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

			}

		</script>
    <script type="x-shader/x-fragment" id="fragmentshader">

			uniform sampler2D baseTexture;
			uniform sampler2D bloomTexture;
			uniform float bloomStrength;

			varying vec2 vUv;

			void main() {

				gl_FragColor = ( texture2D( baseTexture, vUv ) + texture2D( bloomTexture, vUv ) * bloomStrength );

			}

		</script>
  <script type="module">
    

			import * as THREE from 'three';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

			const BLOOM_SCENE = 1;

      // Fireflies
      const fireflies = [];
      const COUNT = 100;
      const AREA = 1000;

			const bloomLayer = new THREE.Layers();
			bloomLayer.set( BLOOM_SCENE );

			const params = {
				threshold: 0,
				strength: 5,
				radius: 0.5,
				exposure: 1
			};

			const darkMaterial = new THREE.MeshBasicMaterial( { color: 'black' } );
			const materials = {};

			const renderer = new THREE.WebGLRenderer( { antialias: false } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.NeutralToneMapping;
			document.body.appendChild( renderer.domElement );

			const scene = new THREE.Scene();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );
			scene.environment = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1100);
			camera.position.set( 0, 0, 20 );
			camera.lookAt( 0, 0, 0 );

			// const controls = new OrbitControls( camera, renderer.domElement );
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = false;
			// controls.maxPolarAngle = Math.PI * 0.5;
			// controls.minDistance = 1;
			// controls.maxDistance = 100;
			// controls.addEventListener( 'change', render );

			const renderScene = new RenderPass( scene, camera );

			const bloomPass = new UnrealBloomPass( new THREE.Vector2( window.innerWidth, window.innerHeight ), 1.5, 0.4, 0.85 );
			bloomPass.threshold = params.threshold;
			bloomPass.strength = params.strength;
			bloomPass.radius = params.radius;

			const bloomRenderTarget = new THREE.WebGLRenderTarget( window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType } );
			const bloomComposer = new EffectComposer( renderer, bloomRenderTarget );
			bloomComposer.renderToScreen = false;
			bloomComposer.addPass( renderScene );
			bloomComposer.addPass( bloomPass );

			const mixPass = new ShaderPass(
				new THREE.ShaderMaterial( {
					uniforms: {
						baseTexture: { value: null },
						bloomTexture: { value: bloomComposer.renderTarget2.texture },
						bloomStrength: { value: params.strength }
					},
					vertexShader: document.getElementById( 'vertexshader' ).textContent,
					fragmentShader: document.getElementById( 'fragmentshader' ).textContent,
					defines: {}
				} ), 'baseTexture'
			);
			mixPass.needsSwap = true;

			const outputPass = new OutputPass();

			const finalRenderTarget = new THREE.WebGLRenderTarget( window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType, samples: 4 } );
			const finalComposer = new EffectComposer( renderer, finalRenderTarget );
			finalComposer.addPass( renderScene );
			finalComposer.addPass( mixPass );
			finalComposer.addPass( outputPass );

			setupScene();

			window.onresize = function () {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

				bloomComposer.setSize( width, height );
				finalComposer.setSize( width, height );

				render();

			};

			function setupScene() {

				scene.traverse( disposeMaterial );
				scene.children.length = 0;

        // Ambient light
        const ambient = new THREE.AmbientLight(0xffffff, 0.05);
        scene.add(ambient);

        const loader = new THREE.TextureLoader().setPath('images/');

        // Skybox
        const skyboxMaterials = [
          new THREE.MeshBasicMaterial({ map: loader.load('2048-px.jpeg'), side: THREE.BackSide }),
          new THREE.MeshBasicMaterial({ map: loader.load('2048-nx.jpeg'), side: THREE.BackSide }),
          new THREE.MeshBasicMaterial({ map: loader.load('2048-py.jpeg'), side: THREE.BackSide }),
          new THREE.MeshBasicMaterial({ map: loader.load('2048-ny.jpeg'), side: THREE.BackSide }),
          new THREE.MeshBasicMaterial({ map: loader.load('2048-pz.jpeg'), side: THREE.BackSide }),
          new THREE.MeshBasicMaterial({ map: loader.load('2048-nz.jpeg'), side: THREE.BackSide })
        ];

        const skyboxGeometry = new THREE.BoxGeometry(1000, 1000, 1000);
        const skybox = new THREE.Mesh(skyboxGeometry, skyboxMaterials);
        skybox.userData = 'skybox';
        scene.add(skybox);

        function setSkyboxBrightness(factor) {
          // factor < 1 → darker, factor > 1 → brighter
          skybox.material.forEach(mat => {
            mat.color.setScalar(factor); 
          });
        }

        window.setSkyboxBrightness = setSkyboxBrightness;

				const geometry = new THREE.IcosahedronGeometry( 1, 15 );

				for ( let i = 0; i < 100; i ++ ) {

					const color = new THREE.Color();
					color.setHSL( Math.random(), 0.7, Math.random() * 0.2 + 0.05 );

					const material = new THREE.MeshStandardMaterial( { color: color, roughness: 1, metalness: 1 } );
					const sphere = new THREE.Mesh( geometry, material );


          sphere.position.set(
            (Math.random() - 0.5) * AREA,
            (Math.random() - 0.5) * AREA * 0.6,
            (Math.random() - 0.5) * AREA
          );

          sphere.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 0.9,
            (Math.random() - 0.5) * 0.9,
            (Math.random() - 0.5) * 0.9
          );
          sphere.userData.rotSpeed = new THREE.Vector3(
            (Math.random() - 0.5) * 0.02,
            (Math.random() - 0.5) * 0.02,
            (Math.random() - 0.5) * 0.02
          );


					scene.add( sphere );
          fireflies.push(sphere);

					// if ( Math.random() < 0.25 ) 
          sphere.layers.enable( BLOOM_SCENE );

				}

				render();

			}

			function disposeMaterial( obj ) {

				if ( obj.material && obj.userData !== 'skybox' ) {

					obj.material.dispose();

				}

			}

			function render() {
        requestAnimationFrame(render);

        for (const m of fireflies) {
          m.position.addScaledVector(m.userData.velocity, 0.8);
          m.rotation.x += m.userData.rotSpeed.x;
          m.rotation.y += m.userData.rotSpeed.y;
          m.rotation.z += m.userData.rotSpeed.z;

          const limit = AREA / 2;
          if (m.position.x > limit) m.position.x = -limit;
          if (m.position.x < -limit) m.position.x = limit;
          if (m.position.y > limit * 0.6) m.position.y = -limit * 0.6;
          if (m.position.y < -limit * 0.6) m.position.y = limit * 0.6;
          if (m.position.z > limit) m.position.z = -limit;
          if (m.position.z < -limit) m.position.z = limit;
        }

        controls.update();

				scene.traverse( darkenNonBloomed );
				bloomComposer.render();
				scene.traverse( restoreMaterial );

				// render the entire scene, then render bloom scene on top
				finalComposer.render();

			}

			function darkenNonBloomed( obj ) {

				if ( obj.isMesh && bloomLayer.test( obj.layers ) === false ) {

					materials[ obj.uuid ] = obj.material;
					obj.material = darkMaterial;

				}

			}

			function restoreMaterial( obj ) {

				if ( materials[ obj.uuid ] ) {

					obj.material = materials[ obj.uuid ];
					delete materials[ obj.uuid ];

				}

			}

		

  </script>
</body>
</html>
